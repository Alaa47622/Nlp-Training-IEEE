[project]
name = "toxic-content-detector"
version = "0.1.0"
description = "Toxic content detection application using LangChain, OpenRouter, Streamlit, uv, and Docker."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-openrouter>=0.0.1",
    "python-dotenv>=1.0.1,<2.0.0",
    "streamlit>=1.40.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
