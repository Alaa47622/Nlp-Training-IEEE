[project]
name = "toxic-comment-classifier"
version = "0.1.0"
description = "End-to-end multi-label toxic comment classification with PyTorch LSTM and MLOps"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "nltk>=3.9",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "mlflow>=2.20",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
