[project]
name = "task3-lora-distilbert"
version = "1.0.0"
description = "Task 3: Multi-label toxicity classification using DistilBERT with LoRA"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.9,<2",
    "datasets>=4.0,<5",
    "evaluate>=0.4,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "peft>=0.17,<1",
    "scikit-learn>=1.5,<2",
    "seaborn>=0.13,<1",
    "torch>=2.5,<3",
    "transformers>=4.55,<5",
    "pyyaml>=6,<7",
    "dvc>=3.60,<4",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "streamlit>=1.48,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
